name: Build and Release

on:
  # push:
    # branches: [ main ]
    # tags: [ 'v*' ]
  # pull_request:
    # branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]
        configuration: [Release]
#        platform: [x64, x86]
#        configuration: [Release, Debug]
        toolset: [v143]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.platform }}" -eq "x64") { "x64" } else { "Win32" }
          cmake -G "Visual Studio 17 2022" -A $arch -DCMAKE_CONFIGURATION_TYPES="Debug;Release" -B _build -S .

      - name: Build
        run: cmake --build _build --config ${{ matrix.configuration }}

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          # If it's a tag, we use its name; if it's a push to main, we use the fixed name 'latest-build'
          $tagName = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "latest-build" }
          $archiveName = "NppGTags_$($tagName)_${{ matrix.platform }}.7z"
          
          mkdir deploy/NppGTags -Force
          copy _build/${{ matrix.configuration }}/NppGTags.dll deploy/NppGTags/
          if (Test-Path bin/*) { copy bin/* deploy/NppGTags/ -Recurse }
          
          7z a -t7z -mx9 $archiveName ./deploy/NppGTags/*
          
          echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$tagName" >> $env:GITHUB_ENV

      - name: Upload Artifact (Workflow)
        uses: actions/upload-artifact@v4
        with:
          name: NppGTags.${{ matrix.platform }}.${{ matrix.configuration }}
          path: ${{ env.ARCHIVE_NAME }}
          # Removes the artifact from the Actions tab after 1 day,
          # freeing up storage space. The release remains.
          retention-days: 1

      - name: Delete Old Release (Auto-builds only)
        # We delete only if it is a push to main (not a tag) and the first task in the matrix (so as not to delete files of colleagues in the matrix)
        if: github.ref_type != 'tag' && matrix.platform == 'x64' && matrix.configuration == 'Release'
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create Release
        # if: github.event_name == 'push' && matrix.configuration == 'Release'
        # if: startsWith(github.ref, 'refs/tags/') && matrix.configuration == 'Release'
        if: matrix.configuration == 'Release'
        uses: softprops/action-gh-release@v2
        with:
          # Force a tag name for the release
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
          # Makes a release a draft if files need to be reviewed first
          # draft: false 
          # Mark as pre-release if it's not an official tag
          prerelease: ${{ github.ref_type != 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
